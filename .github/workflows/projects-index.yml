name: Update project index

# The home page builds its project cards from content/projects/<slug>/*.md.
# Pages can't list folders, so this keeps content/projects/index.json in sync
# Runs on every push to main — direct commits and merged PRs alike — and only
# commits when the folder list actually changed. Its own commit (made with
# GITHUB_TOKEN) doesn't trigger another run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: projects-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index
        run: python3 scripts/build-projects-index.py

      - name: Commit if changed
        id: commit
        run: |
          git add -N content/projects/index.json
          if git diff --quiet -- content/projects/index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects/index.json
          git commit -m "chore: update project index"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # pushes made with GITHUB_TOKEN may not start a Pages build on their own
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
